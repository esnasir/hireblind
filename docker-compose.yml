services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hireblind-postgres
    environment:
      POSTGRES_USER: hireblind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireblind"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── IAM Service ─────────────────────────────────────────────
  iam-service:
    build: ./backend/iam-service
    container_name: hireblind-iam
    expose:
      - "8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hireblind_iam
      SPRING_DATASOURCE_USERNAME: hireblind
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Campaign Service ────────────────────────────────────────
  campaign-service:
    build: ./backend/campaign-service
    container_name: hireblind-campaign
    expose:
      - "8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hireblind_campaign
      SPRING_DATASOURCE_USERNAME: hireblind
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Processing Service ──────────────────────────────────────
  processing-service:
    build: ./backend/processing-service
    container_name: hireblind-processing
    expose:
      - "8083"
    volumes:
      - resume_storage:/app/resumes
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hireblind_processing
      SPRING_DATASOURCE_USERNAME: hireblind
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUDIT_SERVICE_URL: http://audit-service:8084
      CAMPAIGN_SERVICE_URL: http://campaign-service:8082
      SERVER_PORT: 8083
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT}
      IMAP_USERNAME: ${IMAP_USERNAME}
      SPRING_TASK_SCHEDULING_POOL_SIZE: 5
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Audit Service ───────────────────────────────────────────
  audit-service:
    build: ./backend/audit-service
    container_name: hireblind-audit
    expose:
      - "8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hireblind_audit
      SPRING_DATASOURCE_USERNAME: hireblind
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8084
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── API Gateway ─────────────────────────────────────────────
  api-gateway:
    build: ./backend/api-gateway
    container_name: hireblind-gateway
    ports:
      - "8080:8080"
    environment:
      IAM_SERVICE_URL: http://iam-service:8081
      CAMPAIGN_SERVICE_URL: http://campaign-service:8082
      PROCESSING_SERVICE_URL: http://processing-service:8083
      AUDIT_SERVICE_URL: http://audit-service:8084
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8080
    depends_on:
      iam-service:
        condition: service_healthy
      campaign-service:
        condition: service_healthy
      processing-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy

volumes:
  pgdata:
  resume_storage:
