server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: processing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hireblind_processing}
    username: ${SPRING_DATASOURCE_USERNAME:hireblind}
    password: ${SPRING_DATASOURCE_PASSWORD:hireblind_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:hireblind-phase1-shared-hmac-secret-key-that-is-at-least-256-bits-long}

audit:
  service:
    url: ${AUDIT_SERVICE_URL:http://localhost:8084}

campaign:
  service:
    url: ${CAMPAIGN_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [correlationId=%X{correlationId}] - %msg%n"
  level:
    com.hireblind.processing: INFO

llm:
  api:
    key: ${LLM_API_KEY:}
    model:
      name: ${LLM_MODEL_NAME:gemini-2.0-flash-lite}

imap:
  host: ${IMAP_HOST:imap.example.com}
  port: ${IMAP_PORT:993}
  username: ${IMAP_USERNAME:ingest@hireblind.com}
  password: ${IMAP_PASSWORD:secret}
  polling:
    fixed-delay: 300000 # 5 minutes
