server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: iam-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hireblind_iam}
    username: ${SPRING_DATASOURCE_USERNAME:hireblind}
    password: ${SPRING_DATASOURCE_PASSWORD:hireblind_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:hireblind-phase1-shared-hmac-secret-key-that-is-at-least-256-bits-long}
  access-token-expiration-ms: 3600000   # 1 hour
  refresh-token-expiration-ms: 86400000 # 24 hours

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hireblind.iam: DEBUG
    org.springframework.security: INFO
